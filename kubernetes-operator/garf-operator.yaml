apiVersion: v1
kind: Namespace
metadata:
  name: garf-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garf-operator-sa
  namespace: garf-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garf-operator-role
rules:
  - apiGroups: ["garf.io"]
    resources: ["garfcronjobs", "garfcronjobs/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events", "namespaces"]
    verbs: ["create", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: garf-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garf-operator-role
subjects:
  - kind: ServiceAccount
    name: garf-operator-sa
    namespace: garf-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garf-operator
  namespace: garf-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garf-operator
  template:
    metadata:
      labels:
        app: garf-operator
    spec:
      serviceAccountName: garf-operator-sa
      containers:
        - name: operator
          image: ghcr.io/google/garf-operator:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
