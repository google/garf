apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: garfcronjobs.garf.io
spec:
  group: garf.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - schedule
                - workflowPath
              properties:
                schedule:
                  type: string
                  description: "Cron schedule expression"
                workflowPath:
                  type: string
                  description: "Path to the garf workflow"
                configPath:
                  type: string
                  description: "Path to the garf config"
                server:
                  type: object
                  properties:
                    url:
                      type: string
                    server_type:
                      type: string
                env:
                  type: array
                  description: ""
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: garfcronjobs
    singular: garfcronjob
    kind: GarfWorkflowCronJob
    shortNames:
      - garfwcron
