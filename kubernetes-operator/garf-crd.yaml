                    writer_parameters:
                      type: object
                      description: "Parameters to setting up writer"
                      x-kubernetes-preserve-unknown-fields: true
                server:
                  type: object
                  properties:
                    url:
                      type: string
                    server_type:
                      type: string
                env:
                  type: array
                  description: ""
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
