                    type: object
                    required:
                      - path
                    properties:
                      path:
                        type: string
                        description: "Path to a single garf query"
                source:
                  type: string
                  description: "Type of API source for the queries"
                writer:
                  type: string
                  description: "Destination to write query results"
                configPath:
                  type: string
                  description: "Path to the garf config"
