[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garf-actors"
dependencies = [
  "garf-executors",
]
authors = [
  {name = "Google Inc. (gTech gPS CSE team)", email = "no-reply@google.com"},
  {name = "Andrei Markin", email = "andrey.markin.ppc@gmail.com"},
]
requires-python = ">=3.10"
description = "Perform POST / Mutate action over APIs."
readme = "README.md"
license = {text = "Apache 2.0"}
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "garf.actors.version.__version__"}

[project.optional-dependencies]
bq=[
  "garf-executors[bq]",
]
sql=[
  "garf-executors[sql]",
]
server=[
  "garf-executors[server]",
]
tests = [
  "pytest",
  "pytest-mock",
  "pytest-xdist",
  "pytest-grpc",
]
all = [
  "garf-actors[bq,sql,server]"
]

[project.entry-points.garf_actors]
fake = "garf.actors.actors.fake.actor"

[tool.setuptools.packages.find]
where = ["."]
include=["garf.*"]
