[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garf-common-apis"
dependencies = [
  "garf-core[pandas]>=1.1.2",
  "garf-io>=1.0.0",
]
authors = [
  {name = "Google Inc. (gTech gPS CSE team)", email = "no-reply@google.com"},
]
license = {text = "Apache 2.0"}
requires-python = ">=3.9"
description = "garf sources for common public REST APIs (OpenWeather, CurrencyAPI)"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]

dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "garf.community.common_apis.__version__"}

[project.entry-points.garf]
openweather = "garf.community.common_apis.openweather.report_fetcher"
currencyapi = "garf.community.common_apis.currencyapi.report_fetcher"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "python-dotenv",
  "responses",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["garf.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
