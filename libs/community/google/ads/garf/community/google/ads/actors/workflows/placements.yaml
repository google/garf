name: placements
metadata:
  version: '0.0.0'
  description: |
    Gets ad group level placement performance from group_placement_view resource.
steps:
  - fetcher: google-ads
    alias: task
    writer:
      - sqldb
    queries:
      - text: |
          SELECT
            customer.id AS customer_id,
            ad_group.id AS ad_group_id,
            group_placement_view.placement AS placement,
            group_placement_view.placement_type AS placement_type,
            group_placement_view.display_name AS name,
            {% for metric in metrics %}
            {% if metric == "cost" %}
              metrics.cost_micros / 1e6 AS cost,
            {% else %}
              metrics.{{ metric }} AS {{ metric }},
            {% endif %}
            {% endfor %}
          FROM group_placement_view
          WHERE
            group_placement_view.target_url NOT IN (
              'youtube.com',
              'mail.google.com',
              'adsenseformobileapps.com'
            )
            AND campaign.advertising_channel_type IN (
              {% for campaign_type in campaign_types -%}
                {{ campaign_type | upper }}{% if not loop.last %}, {% endif %}
              {%- endfor %}
            )
            AND group_placement_view.placement_type IN (
              {% for placement_type in placement_types -%}
                {{ placement_type | upper }}{% if not loop.last %}, {% endif %}
              {%- endfor %}
            )
            AND campaign.status = ENABLED
            AND ad_group.status = ENABLED
            AND segments.date >= "{{start_date}}"
            AND segments.date <= "{{end_date}}"
        title: placement_performance
    query_parameters:
      template:
        start_date: :YYYYMMDD-30
        end_date: :YYYYMMDD-1
        metrics:
          - clicks
          - impressions
          - cost
          - conversions
        campaign_types:
          - DISPLAY
          - DEMAND_GEN
          - SEARCH
        placement_types:
          - WEBSITE
          - YOUTUBE_VIDEO
          - YOUTUBE_CHANNEL
          - MOBILE_APPLICATION
          - MOBILE_APP_CATEGORY

  - alias: evaluation
    fetcher: sqldb
    queries:
      - text: |
          SELECT *
          FROM placement_performance
          WHERE {{filters}}
        title: evaluation
    query_parameters:
      macro_expansion: False
      template:
        filters: "TRUE"
