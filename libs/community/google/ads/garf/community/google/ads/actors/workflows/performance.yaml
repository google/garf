name: campaign_performance
metadata:
  version: '0.0.0'
  description: |
    Gets campaign level performance.
steps:
  - fetcher: google-ads
    alias: task
    writer:
      - sqldb
    queries:
      - text: |
          SELECT
            customer.id AS customer_id,
            campaign.name AS campaign_name,
            campaign.id AS campaign_id,
            {% for metric in metrics %}
            {% if metric == "cost" %}
              metrics.cost_micros / 1e6 AS cost,
            {% else %}
              metrics.{{ metric }} AS {{ metric }},
            {% endif %}
            {% endfor %}
          FROM campaign
          WHERE
            campaign.status = ENABLED
            AND segments.date >= "{{start_date}}"
            AND segments.date <= "{{end_date}}"
        title: performance
    query_parameters:
      template:
        start_date: :YYYYMMDD-30
        end_date: :YYYYMMDD-1
        budget_change: 0.0
        max_delta:  0.0
        metrics:
          - clicks
          - impressions
          - cost
          - conversions

  - alias: evaluation
    fetcher: sqldb
    queries:
      - text: |
          SELECT
            *
          FROM performance
          WHERE {{filters}}
        title: evaluation
    query_parameters:
      macro_expansion: False
      template:
        filters: "TRUE"
