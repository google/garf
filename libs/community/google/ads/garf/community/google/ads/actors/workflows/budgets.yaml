name: budgets
metadata:
  version: '0.0.0'
  description: |
    Gets budgets and performance metrics for active campaigns.
steps:
  - fetcher: google-ads
    alias: task
    writer:
      - sqldb
    queries:
      - text: |
          SELECT
            customer.id AS customer_id,
            campaign.name AS campaign_name,
            campaign.id AS campaign_id,
            campaign.advertising_channel_type AS campaign_type,
            campaign_budget.resource_name AS budget_resource_name,
            campaign_budget.amount_micros / 1e6 AS budget,
            {% for metric in metrics %}
            {% if metric == "cost" %}
              metrics.cost_micros / 1e6 AS cost,
            {% else %}
              metrics.{{ metric }} AS {{ metric }},
            {% endif %}
            {% endfor %}
          FROM campaign
          WHERE
            campaign.status = ENABLED
            AND segments.date >= "{{start_date}}"
            AND segments.date <= "{{end_date}}"
            AND campaign.advertising_channel_type IN (
              {% for campaign_type in campaign_types -%}
                {{ campaign_type | upper }}{% if not loop.last %}, {% endif %}
              {%- endfor %}
            )
        title: budgets
    query_parameters:
      template:
        start_date: :YYYYMMDD-30
        end_date: :YYYYMMDD-1
        metrics:
          - clicks
          - impressions
          - cost
          - conversions
        campaign_types:
          - DISPLAY
          - DEMAND_GEN
          - SEARCH
          - PERFORMANCE_MAX
          - MULTI_CHANNEL

  - alias: evaluation
    fetcher: sqldb
    queries:
      - text: |
          SELECT
            *,
            {{ budget_change | float }} AS budget_change,
            {{ max_delta | int }} max_delta
          FROM budgets
          WHERE {{filters}}
        title: evaluation
    query_parameters:
      macro_expansion: False
      template:
        budget_change: 0.0
        max_delta:  0.0
        filters: "TRUE"
