apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garf.fullname" . }}
  labels:
    {{- include "garf.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.garf.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "garf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "garf.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "garf.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{ if eq .Values.garf.server.type "http" }}
          command:
            - "/venv/bin/opentelemetry-instrument"
            - "/venv/bin/uvicorn"
            - "garf.executors.entrypoints.server:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.service.port | int }}"
          {{ else if eq .Values.garf.server.type "grpc" }}
          command:
            - "/venv/bin/opentelemetry-instrument"
            - "/venv/bin/python"
            - "-m"
            - "garf.executors.entrypoints.grpc_server"
            - "--port"
            - "{{ .Values.service.port | int }}"
          {{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.garf.server.type }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
          {{- if .Values.redis.enabled }}
            - name: CELERY_BROKER_URL
              value: {{ include "garf.redisUrl" . | quote }}
            - name: GARF_CACHE_LOCATION
              value: {{ include "garf.redisUrl" . | quote }}
          {{- end }}
          {{- if .Values.garf.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.garf.otel.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.garf.otel.otelExporterOtlpEndpoint | quote }}
          {{- end }}
          {{- with .Values.env }}
          {{- include "garf.renderEnv" . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
