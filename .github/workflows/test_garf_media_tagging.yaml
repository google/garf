name: Run tests for garf-media-tagging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'libs/community/experimental/media-tagging/garf/**'

env:
  UV_SYSTEM_PYTHON: 1

permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f
        with:
          version: "0.5.4"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv pip install pytest
      - name: Test ${{ matrix.library }}
        run: |
          uv pip install -e libs/core/.[all,test]
          uv pip install -e libs/io/.[test,all]
          uv pip install -e libs/executors/.[all]
          cd libs/community/experimental/media-tagging/
          uv pip install -e .
          pytest tests/unit
